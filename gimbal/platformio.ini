[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 921600
; The core log writes to the same UART as the binary sample stream, so a single
; Wire.cpp I2C error injects "[ 12345][E][Wire.cpp:499] ..." between records and
; can corrupt the record it lands in. Silence it; I2C failures are already
; reported per-sample via FLAG_I2C and in the i2c_err_start/end META counters.
build_flags = -D CORE_DEBUG_LEVEL=0
lib_deps =
  madhephaestus/ESP32Servo
