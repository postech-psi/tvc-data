# Coaxial thrust/torque grid.
#
# This file is the run. Check it in, and the manifest keeps a verbatim copy, so
# a run is reproducible from its own output directory.
#
#   python -m tvcbench plan show plans/coax_grid.yaml --segments
#   python -m tvcbench run  plans/coax_grid.yaml --no-motor
#   python -m tvcbench run  plans/coax_grid.yaml

schema_version: 1

# Microseconds, [start, end, step], both ends inclusive.
# A is the fixed (outer) rotor, B the swept (inner) one.
grid:
  a: [1300, 1600, 100]
  b: [1000, 2000, 100]

repeats: 2

order:
  # Each repeat is an independently shuffled complete pass over the grid. The
  # pack drains monotonically, so a grid walked in order makes every high-B
  # point a low-voltage point and the two can never be separated.
  mode: blocked_random
  seed: 20260725          # 0 picks a fresh seed and records it in the manifest

dwell:
  # Start here. Move to sem_target once fixed-dwell runs are trusted -- adaptive
  # modes make the run's timing depend on the force sensor.
  mode: fixed
  fixed_s: 4.0
  min_s: 2.0
  max_s: 8.0
  target_thrust_sem_n: 0.05

# Return to a fixed point periodically so drift can be fitted as a covariate
# rather than merely bracketed at the ends.
reference:
  a: 1500
  b: 1500
  every_n_steps: 8

# Both rotors at minimum, current near zero: this voltage is the pack's true
# state of charge, with no IR drop in it.
idle:
  pre_s: 10
  post_s: 10

tare:
  seconds: 10             # recorded raw; offsets go in the manifest, not the data

limits:
  min_voltage_v: 9.9      # 3S: 3.3 V/cell
  max_current_a: 60
  max_thrust_n: 40        # catches a shed blade or a slipped mount
  max_torque_nm: 1.0
  loadcell_dropout_s: 0.5
  heartbeat_timeout_s: 3.0

hardware:
  fc:
    device: /dev/ttyAMA0
    baud: 921600
    servo_hz: 50          # requested; PX4 has historically delivered ~18-20
    battery_hz: 20
    esc_hz: 20
  loadcell:
    device: /dev/tvc-loadcell    # see `tvcbench devices --probe` for the udev rule
    baud: 115200

meta:
  prop: ""
  battery: ""
  operator: ""
  notes: ""
